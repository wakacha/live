<script>
/* ===== SOURCE STATS ===== */
function getStats() {
  return JSON.parse(localStorage.getItem('rtm_stats') || '{}');
}

function saveStats(stats) {
  localStorage.setItem('rtm_stats', JSON.stringify(stats));
}

function markFail(src) {
  const stats = getStats();
  stats[src] = stats[src] || { ok: 0, fail: 0 };
  stats[src].fail++;
  saveStats(stats);
}

function markOk(src) {
  const stats = getStats();
  stats[src] = stats[src] || { ok: 0, fail: 0 };
  stats[src].ok++;
  saveStats(stats);
}

/* ===== SOURCE LIST ===== */
var sources = [
    "https://tfxm0gwhnhctsfa51hcttgossa4mscwa1hh5wqj1sn5mnxfsg17ufqb4sah5f.100ycdn.com/live1.streambylivepulse.com/live/channel62/playlist.m3u8",
   // "https://on.bbr1.workers.dev/tv3.m3u8",
    //"https://on.bbr3.workers.dev/tv3.m3u8",
    "https://geogersr.itilstrem.workers.dev/http://moo7-restream2025.ddns.net:9091/Sport_tv_ts2/index.m3u8"
];

/* ===== SORT SOURCE ===== */
const statsForSort = getStats();
sources.sort(function (a, b) {
  const sa = statsForSort[a] || { fail: 0 };
  const sb = statsForSort[b] || { fail: 0 };
  return sa.fail - sb.fail;
});

/* ===== SESSION PINNING ===== */
function getPinnedSource() {
  let pinned = sessionStorage.getItem('rtm_source');
  if (pinned && sources.includes(pinned)) {
    return pinned;
  }
  let pick = sources[Math.floor(Math.random() * sources.length)];
  sessionStorage.setItem('rtm_source', pick);
  return pick;
}

function pinSource(src) {
  sessionStorage.setItem('rtm_source', src);
}

/* ===== PLAYER INIT ===== */
var currentSourceIndex = sources.indexOf(getPinnedSource());
if (currentSourceIndex < 0) currentSourceIndex = 0;
var failCount = 0;
var MAX_FAIL = sources.length;

var player = new Clappr.Player({
  source: sources[currentSourceIndex],
  parentId: "#player",
  width: "100%",
  height: "100%",
  autoPlay: true,
  mute: true,
  preload: 'auto',
  playback: {
    playInline: true,
    hlsjsConfig: {
      enableWorker: true,
      lowLatencyMode: true,
    }
  },
  plugins: { 
    playback: [DashShakaPlayback, HlsjsPlayback] 
  },
  shakaConfiguration: {
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 6,
      rebufferingGoal: 2,
      alwaysStreamText: false,
    },
    manifest: {
      dash: {
        ignoreMinBufferTime: true,
      }
    },
    drm: {
      clearKeys: {
        "60dc08aae52f4c0b806a8e43f24a12c8": "30d5b579966d822b215ec51a91d8a271",
        'ce43641a061a44fb9d95d986cfc9a68f': '3d63855ca5cdfcfb765f306b98bcc646'
      }
    }
  }
});

/* ===== FAILOVER LOGIC ===== */
async function checkSource(url) {
  try {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 2000); // 2s timeout
    const response = await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
    clearTimeout(id);
    return true; // If we get any response, even no-cors, it's likely alive
  } catch (e) {
    return false;
  }
}

async function loadNextSource() {
  failCount++;
  if (failCount >= MAX_FAIL) {
    console.error("Semua source gagal. Stop retry.");
    return;
  }
  markFail(sources[currentSourceIndex]);
  
  console.warn("Mencari source yang aktif...");
  
  // Try to find next working source by skipping known failures
  let found = false;
  for (let i = 0; i < 5; i++) { // Check next 5 sources
    let nextIndex = (currentSourceIndex + 1) % sources.length;
    currentSourceIndex = nextIndex;
    
    // Quick pre-check
    const isAlive = await checkSource(sources[currentSourceIndex]);
    if (isAlive) {
      found = true;
      break;
    }
    console.warn("Skip source mati:", sources[currentSourceIndex]);
    markFail(sources[currentSourceIndex]);
    failCount++;
  }

  pinSource(sources[currentSourceIndex]);
  player.load(sources[currentSourceIndex]);
}

/* ===== EVENT HANDLING ===== */
player.on(Clappr.Events.PLAYER_ERROR, function (e) {
  console.warn("PLAYER ERROR:", e);
  loadNextSource();
});

player.on(Clappr.Events.PLAYER_PLAY, function () {
  markOk(sources[currentSourceIndex]);
  failCount = 0;
});

/* ===== CHANNEL CLICK ===== */
document.querySelectorAll(".channel").forEach(el => {
  el.addEventListener("click", () => {
    try {
      // Remove active class from all buttons
      document.querySelectorAll(".channel").forEach(btn => btn.classList.remove("active"));
      // Add active class to clicked button
      el.classList.add("active");
      
      // Load new sources
      sources = JSON.parse(el.dataset.sources);
      currentSourceIndex = 0;
      failCount = 0;
      pinSource(sources[0]);
      player.load(sources[0]);
    } catch (e) {
      console.error("Source error", e);
    }
  });
});

/* ===== FULLSCREEN ORIENTATION ===== */
function onFullScreenChange() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    screen.orientation?.lock("landscape").catch(() => {});
  } else {
    screen.orientation?.unlock?.();
  }
}

document.addEventListener("fullscreenchange", onFullScreenChange);
document.addEventListener("webkitfullscreenchange", onFullScreenChange);
